name: Release Pisek ⏳

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7 # see https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-python for more details
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Pisek
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Check that the release tag matches Pisek version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(python -c "from pisek.version import __version__; print(__version__)")
        if [ "$TAG" != "v$version" ]; then
          echo "::error::Release tag '$TAG' does not match Pisek version 'v$version' (pisek/version.py)"
          exit 1
        fi
    - name: Build dist/
      run: |
        pip install build
        python3 -m build
    - name: Upload dist/
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish:
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pisek

    permissions:
      id-token: write

    steps:
    - name: Download dist/
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
