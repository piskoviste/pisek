name: Test Pisek ⏳

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel outdated runs when a PR gets new commits (but let every master run finish)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install Pisek
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Install task compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y fpc
    - name: Check task compilers
      # Fail loudly if the runner image stops shipping a toolchain the fixtures use
      run: |
        gcc --version | head -n 1
        g++ --version | head -n 1
        fpc -iV
        javac -version
        java -version
        go version
        ghc --version
        rustc --version
        cargo --version
    - name: Test Pisek itself
      run: |
        ./tests.sh

  lint:
    name: Formatting and typing
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12" # Oldest supported version
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install Pisek
      id: install
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"
    - name: Check formatting
      run: |
        black . --check
    - name: Check typing
      # Run even if formatting fails, so both problems show up at once
      if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      run: |
        mypy pisek tests
